name: .NET CI

on:
  push:
    branches: [ "master" ] # اگر شاخه اصلی شما master است، این را به master تغییر دهید
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # ⚠️ مهم: این را به نسخه .NET مورد استفاده پروژه خود تغییر دهید (مثلاً 6.0.x یا 7.0.x)

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --verbosity normal
